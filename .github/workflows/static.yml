  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">一次拷贝</span><div class="desc">binder_open → mmap 映射内核空间与用户空间共享内存，数据只需一次 copy_from_user</div></div></div></li>
