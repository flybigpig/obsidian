    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">onMeasure()</span><div class="desc">确定大小；<b>只有 ViewGroup 需要 onLayout</b>，普通 View 只做首尾两步</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">onLayout()</span><div class="desc">确定子 View 位置（仅 ViewGroup）</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">onDraw()</span><div class="desc">用 Canvas + Paint 绘制内容；Hardware Layer / 软件绘制切换</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">11.2 驱动入口与帧调度 <span class="tag tag-key">核心</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">ViewRootImpl.performTraversals()</span><div class="desc">requestLayout()/invalidate() 最终汇聚于此，统一触发 measure/layout/draw</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Choreographer + VSync</span><div class="desc">下一个 vsync 信号触发遍历，受 <b>16.6ms (60Hz)</b> 帧预算约束</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">11.3 MeasureSpec 契约</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">mode(2bit)+size(30bit)</span><div class="desc">打包成 int；子 View 的 Spec 由「父 Spec + 自身 LayoutParams」经 <span class="code">getChildMeasureSpec()</span> 推导</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">三种 mode</span><div class="desc">EXACTLY (确定) / AT_MOST (wrap) / UNSPECIFIED (滚动容器)；wrap_content 必须自行处理</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">11.4 DecorView 与 View 树</span><div class="desc">DecorView 为窗口根 View；PhoneWindow 持有，经 ViewRootImpl 关联 WMS（见模块 3.2）</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">11.5 Surface / Canvas / 硬件加速</span><div class="desc">View 绘制到 Surface（BufferQueue 缓冲）；HWUI(Skia/GL/Vulkan) 硬件加速，与模块 12 渲染管线衔接</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">11.6 绘制性能红线 <span class="tag tag-new">补全</span></span><div class="desc">onDraw 零对象分配（避免 GC 抖动）；requestLayout 代价 ≫ invalidate，只改外观勿触发 measure/layout；自定义 ViewGroup 自绘需 <span class="code">setWillNotDraw(false)</span></div></div></div></li>
</ul>
</li>

