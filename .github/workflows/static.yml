    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">libbinder 封装</span><div class="desc"><span class="code">ProcessState::self()</span> 打开 /dev/binder + mmap 一次拷贝；<span class="code">IPCThreadState</span> 驱动收发；<span class="code">BinderService&lt;T&gt;</span> 模板统一注册模式</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">AIDL C++ 侧</span><div class="desc">aidl_interface 生成 C++ Proxy/Stub，native 服务间通信与 Java 层同构</div></div></div></li>
  </ul>
  </li>
