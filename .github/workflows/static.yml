<script>
function toggleNode(el) {
  const li = el.closest('li');
  const ul = li.querySelector(':scope > ul');
  if (!ul) return;
  const hidden = ul.classList.toggle('hidden');
  el.textContent = hidden ? '▶' : '▼';
}
function setAll(expand) {
  document.querySelectorAll('#tree ul').forEach(ul => {
    ul.classList.toggle('hidden', !expand);
  });
  document.querySelectorAll('#tree .toggle').forEach(t => {
    if (!t.classList.contains('leaf')) t.textContent = expand ? '▼' : '▶';
  });
}
function expandAll() { setAll(true); }
function collapseAll() { setAll(false); }
function toggleLevel(maxLevel) {
  setAll(false);
  const roots = document.querySelectorAll('#tree > li');
  function walk(li, level) {
    if (level >= maxLevel) return;
    const ul = li.querySelector(':scope > ul');
    if (ul) {
      ul.classList.remove('hidden');
      const tog = li.querySelector(':scope > .row .toggle');
      if (tog && !tog.classList.contains('leaf')) tog.textContent = '▼';
      ul.querySelectorAll(':scope > li').forEach(child => walk(child, level + 1));
    }
  }
  roots.forEach(r => walk(r, 1));
}
toggleLevel(2);
</script>
