    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">通信流程 <span class="tag tag-flow">流程</span></span><div class="desc">Client → ioctl(BINDER_WRITE_READ) → 内核 binder_thread → 拷贝到目标 mmap 区 → 目标进程唤醒处理</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">线程池</span><div class="desc">每个 Binder 服务进程维护线程池 (默认 15)，binder_looper 处理请求，避免阻塞</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">内核调试节点 <span class="tag tag-new">补全</span></span><div class="desc"><span class="code">/sys/kernel/debug/binder/stats</span>（进程/线程/对象统计）· <span class="code">transaction_log</span>（事务日志）· <span class="code">ls -l /dev/binder</span>；binder 泄漏特征：进程 binder 节点数持续增长</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">oneway 与事务上限 <span class="tag tag-new">补全</span> <span class="tag tag-flow">踩坑</span></span><div class="desc">oneway 异步调用不阻塞（driver 队列），不保证顺序；<b>单事务上限 ~1MB</b>，超限抛 <span class="code">TransactionTooLargeException</span>（车载传大图/长列表高频踩坑 → 改 file/socket 或分片）</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">7.3 AIDL 接口</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">AIDL 文件</span><div class="desc">.aidl 定义 → 编译生成 Stub/Proxy，Stub.onTransact + Proxy 调用</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Stable AIDL <span class="tag tag-hal">HAL</span></span><div class="desc">AOSP 11+ 稳定 AIDL，支持版本化、用于 HAL，<span class="code">aidl_interface</span> 模块</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">7.4 调试手段</span><div class="desc"><span class="code">dumpsys -l</span> · <span class="code">service list</span> · <span class="code">cat /sys/kernel/debug/binder/stats</span> · Binder 事务溢出 (TransactionTooLargeException)</div></div></div></li>
</ul>
</li>

<!-- ===== 8. Linux Kernel Binder 驱动 (binder.c) ===== -->
<li class="node lv1"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8. Linux Kernel Binder 驱动 (binder.c) <span class="tag tag-key">核心</span> <span class="tag tag-src">drivers/android/binder.c · binder_alloc.c</span></span><div class="desc">Binder IPC 的内核实现：一次拷贝、事务协议、节点/引用/死亡通知（与模块 7 框架层互补）</div></div></div>
<ul>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.1 驱动架构</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">源码布局</span><div class="desc"><span class="code">drivers/android/binder.c</span>（核心）· <span class="code">binder_alloc.c</span>（mmap 内存管理）· <span class="code">binderfs</span>（binderfs 设备节点，AOSP 12+）</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">多设备节点</span><div class="desc"><span class="code">/dev/binder</span>（system 域）· <span class="code">/dev/hwbinder</span>（HAL）· <span class="code">/dev/vndbinder</span>（vendor），同一驱动多实例，selinux 按节点隔离（见模块 15）</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">职责</span><div class="desc">跨进程数据拷贝、进程/线程记账、节点引用管理、死亡通知；内核态无锁热路径 binder_thread_lock</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.2 核心数据结构 <span class="tag tag-src">include/uapi/linux/android/binder.h</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">进程/线程</span><div class="desc"><span class="code">binder_proc</span>（进程对象，含 mmap 区与节点表）· <span class="code">binder_thread</span>（线程事务上下文 + todo 队列）</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">实体/引用</span><div class="desc"><span class="code">binder_node</span>（服务端实体，含强弱引用）· <span class="code">binder_ref</span>（客户端引用，含 handle）· <span class="code">binder_object</span>/<span class="code">flat_binder_object</span>（事务内对象编解码）</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">事务/缓冲</span><div class="desc"><span class="code">binder_transaction</span>（事务记录）· <span class="code">binder_buffer</span>（mmap 缓冲块分配）· <span class="code">binder_transaction_log</span>（调试日志）</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.3 mmap 与一次拷贝 <span class="tag tag-key">核心</span> <span class="tag tag-flow">原理</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">binder_mmap</span><div class="desc">服务进程 mmap 一段虚拟区，内核映射到同一物理页（默认 8 页起步、事务区上限约 1MB）→ 发送方仅一次 copy_from_user 写入，接收方直接读取，无需二次拷贝</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">缓冲区分配</span><div class="desc"><span class="code">binder_alloc_new_buf</span> 从 mmap 区分配，最佳适配/首次适配策略；<span class="code">/proc/binder</span>（旧）/ <span class="code">/sys/kernel/debug/binder</span>（新）看统计</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">大小限制</span><div class="desc">单事务数据上限 ~1MB（BINDER_MAX_TRANSACTION_SIZE）；超限抛 TransactionTooLargeException（见模块 7）</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.4 通信流程与协议码 <span class="tag tag-flow">流程</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">ioctl 入口</span><div class="desc"><span class="code">BINDER_WRITE_READ</span> 双向读写（主要入口）· BINDER_SET_CONTEXT_MGR（servicemanager 注册）· BINDER_SET_MAX_THREADS · BINDER_VERSION</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">BC/BR 协议</span><div class="desc">客户端下发 <span class="code">BC_TRANSACTION / BC_REPLY / BC_FREE_BUFFER / BC_ACQUIRE</span>；服务端收到 <span class="code">BR_TRANSACTION / BR_REPLY / BR_DEAD_BINDER</span>；<span class="code">binder_thread_read</span> 阻塞等待 todo</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">oneway 与递归</span><div class="desc">oneway 事务入队即返回（不等待回复）；同步调用递归/重入由内核按线程栈约束（binder 事务深度限制）</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.5 节点/引用/死亡通知</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">引用计数</span><div class="desc">binder_node 强弱引用（BC_INCREFS/BC_ACQUIRE），binder_ref 对应客户端 handle 生命周期</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">死亡通知</span><div class="desc"><span class="code">BC_REQUEST_DEATH_NOTIFICATION</span> 注册 → 服务进程死亡时内核发 <span class="code">BR_DEAD_BINDER</span> 回调（linkToDeath），App 据此感知远端崩溃</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">进程退出清理</span><div class="desc"><span class="code">binder_release</span> 遍历节点/引用释放，通知所有死亡监听者；孤儿事务清理</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">8.6 调试与安全</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">内核调试</span><div class="desc"><span class="code">/sys/kernel/debug/binder/stats</span>（proc/thread/node/ref 统计）· <span class="code">transaction_log/failed_transaction_log</span> · <span class="code">dmesg | grep binder</span></div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">安全</span><div class="desc">selinux 对 binder 调用的域许可（binder_call/binder_transfer）；neverallow 约束跨域通信（见模块 15）；Android 内核配置 CONFIG_ANDROID_BINDER_IPC / CONFIG_BINDERFS</div></div></div></li>
  </ul>
  </li>
</ul>
</li>
<!-- ===== 9. native 系统服务（C++ 侧） ===== -->
<li class="node lv1"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">9. native 系统服务（C++ 侧） <span class="tag tag-src">frameworks/native/services/ · system/core/ · system/vold/ · system/netd/</span></span><div class="desc">独立进程的 C++ 系统服务，经 libbinder 注册到 servicemanager，承载文件/网络/媒体/内存等底层能力</div></div></div>
