  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">9.5 调试</span><div class="desc"><span class="code">service list</span> 查注册 · <span class="code">dumpsys &lt;native_service&gt;</span> · <span class="code">logcat -b system</span> · perfetto 抓 native 调用栈</div></div></div></li>
