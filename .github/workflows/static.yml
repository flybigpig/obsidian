<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AOSP Framework 核心知识点树状图</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2027;
    --border: #2a3441;
    --text: #e1e4e8;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent2: #f0c674;
    --accent3: #7ee787;
    --accent4: #ff7b72;
    --accent5: #d2a8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px;
  }
  .header {
    text-align: center;
    padding: 20px 0 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .header .sub {
    color: var(--text-dim);
    font-size: 13px;
  }
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .controls button {
    background: var(--panel);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.15s;
  }
  .controls button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .tree-container {
    max-width: 1200px;
    margin: 0 auto;
  }
  ul.tree {
    list-style: none;
    padding-left: 0;
  }
  ul.tree ul {
    list-style: none;
    padding-left: 22px;
    margin-top: 2px;
  }
  li.node {
    position: relative;
    margin: 2px 0;
  }
  li.node::before {
    content: "";
    position: absolute;
    left: -14px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
  }
  li.node:last-child::before {
    bottom: auto;
    height: 14px;
  }
  li.node::after {
    content: "";
    position: absolute;
    left: -14px;
    top: 14px;
    width: 14px;
    height: 1px;
    background: var(--border);
  }
  ul.tree > li.node::before,
  ul.tree > li.node::after {
    display: none;
  }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    transition: background 0.12s;
  }
  .row:hover {
    background: var(--panel);
  }
  .toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    cursor: pointer;
    color: var(--text-dim);
    font-size: 12px;
    user-select: none;
    margin-top: 2px;
    transition: color 0.12s;
  }
  .toggle:hover { color: var(--accent); }
  .toggle.leaf { cursor: default; opacity: 0; }
  .label {
    flex: 1;
  }
  .label .title {
    font-weight: 500;
  }
  .label .desc {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-top: 2px;
  }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 10px;
    margin-left: 8px;
    font-weight: 400;
    vertical-align: middle;
  }
  .lv1 > .row .title { color: var(--accent); font-size: 15px; font-weight: 600; }
  .lv2 > .row .title { color: var(--accent2); font-weight: 600; }
  .lv3 > .row .title { color: var(--accent3); }
  .lv4 > .row .title { color: var(--text); }
  .lv5 > .row .title { color: var(--text-dim); font-size: 13px; }

  .tag-src { background: rgba(255,123,114,0.12); color: var(--accent4); }
  .tag-key { background: rgba(210,168,255,0.12); color: var(--accent5); }
  .tag-flow { background: rgba(126,231,135,0.12); color: var(--accent3); }
  .tag-hal { background: rgba(88,166,255,0.12); color: var(--accent); }
  .tag-new { background: rgba(240,198,116,0.16); color: var(--accent2); }

  .hidden { display: none; }
  .code {
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 11.5px;
    color: var(--accent4);
    background: rgba(255,123,114,0.06);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .legend {
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--text-dim);
    justify-content: center;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>AOSP Framework 核心知识点树状图</h1>
  <div class="sub">基于 AOSP 13/14 · 分层架构 · 源码路径标注 · 手机系统 / 车载 / 工控定制视角 · 已对照资产文档补全</div>
  <div class="controls">
    <button onclick="expandAll()">全部展开</button>
    <button onclick="collapseAll()">全部折叠</button>
    <button onclick="toggleLevel(2)">展开到 2 级</button>
    <button onclick="toggleLevel(3)">展开到 3 级</button>
  </div>
</div>

<div class="legend">
  <span><i style="background:var(--accent4)"></i>源码路径</span>
  <span><i style="background:var(--accent5)"></i>核心概念</span>
  <span><i style="background:var(--accent3)"></i>流程链路</span>
  <span><i style="background:var(--accent)"></i>HAL/接口</span>
  <span><i style="background:var(--accent2)"></i>本次新增/补全</span>
</div>

<div class="tree-container">
<ul class="tree" id="tree">

<!-- ===== 1. 系统启动流程 ===== -->
<li class="node lv1"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">1. 系统启动流程 (Boot Flow) <span class="tag tag-src">system/core/init/ · frameworks/base/core/java/com/android/internal/os/ZygoteInit.java · frameworks/base/services/java/com/android/server/SystemServer.java</span></span><div class="desc">从 init 到系统服务就绪的完整链路，车载定制必读</div></div></div>
<ul>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">1.1 Bootloader & Kernel 阶段</span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Bootloader (aboot/lk)</span><div class="desc">初始化硬件、加载 boot.img，传递 cmdline</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Kernel 启动</span><div class="desc">start_kernel → 初始化驱动模型、挂载 tmpfs、启动 init 进程 (PID 1)</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">1.2 init 进程 <span class="tag tag-src">system/core/init</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">First Stage Init</span><div class="desc">挂载 /system、/vendor 等分区，SELinux 编译策略加载</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Second Stage Init</span><div class="desc">解析 <span class="code">*.rc</span> 文件、启动属性服务、触发 <span class="code">on early-init / init / post-fs / boot</span></div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">关键 rc 文件</span><div class="desc"><span class="code">init.rc</span> · <span class="code">init.**.rc</span> · <span class="code">ueventd.rc</span> · <span class="code">vendor/odm</span> 自定义 rc</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">服务启动 (Service)</span><div class="desc"><span class="code">service zygote / system/bin/app_process</span> · <span class="code">servicemanager</span> · <span class="code">surfaceflinger</span> · <span class="code">audioserver</span></div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">1.3 Zygote 孵化器 <span class="tag tag-src">frameworks/base/core/java/com/android/internal/os/ZygoteInit.java</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">ZygoteInit.main()</span><div class="desc">preloadClasses / preloadResources / preloadDrawables → 预加载公共资源</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">forkSystemServer()</span><div class="desc">fork 出 SystemServer 进程，Zygote 自身进入 <span class="code">runSelectLoop()</span> 等待 fork 请求</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Zygote Fork 模型 <span class="tag tag-key">核心</span></span><div class="desc">App 进程通过 Socket 请求 Zygote fork，子进程继承预加载资源，避免每个 App 重复加载 → 启动加速</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Zygote Socket 通信 <span class="tag tag-new">补全</span></span><div class="desc">App 侧 <span class="code">ZygoteProcess.openZygoteSocketIfNeeded()</span> 建 LocalSocket → 传输 fork 参数（pid/uid/gids/capabilities/class）→ Zygote 侧 <span class="code">ZygoteConnection.runOnce()</span> 解析并 forkAndSpecialize</div></div></div></li>
  </ul>
  </li>
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">1.4 SystemServer 进程入口 <span class="tag tag-src">frameworks/base/services/java/com/android/server/SystemServer.java</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Zygote fork 后</span><div class="desc">ZygoteConnection → forkAndSpecialize → SystemServer.main()</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">主线程初始化</span><div class="desc">Looper.prepareMainLooper → 创建 SystemContext → 加载 framework-res</div></div></div></li>
  </ul>
  </li>
</ul>
</li>

<!-- ===== 2. SystemServer 启动阶段 ===== -->
<li class="node lv1"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">2. SystemServer 启动阶段 <span class="tag tag-src">frameworks/base/services/java/com/android/server/SystemServer.java</span></span><div class="desc">SystemServer 服务注册与启动时序，决定核心服务何时就绪</div></div></div>
<ul>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.1 run() 入口</span><div class="desc">初始化 VM、加载库、创建 SystemContext、调用 startBootstrapServices 等</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.2 startBootstrapServices()</span><div class="desc">引导服务：AMS、PowerMS、DisplayMS、PackageManagerService、SensorService</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.3 startCoreServices()</span><div class="desc">核心服务：BatteryService、GpuStatsService 等</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.4 startOtherServices()</span><div class="desc">其他服务：WMS、InputMS、NotificationMS、LocationMS、BluetoothService（耗时最长）</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.5 systemReady() <span class="tag tag-flow">流程</span></span><div class="desc">AMS.systemReady → 启动 Launcher → 进入 HOME → 发送启动完成广播</div></div></div></li>
  <li class="node lv2"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">2.6 startApexServices()</span><div class="desc">mainline 模块相关服务 (AOSP 11+)</div></div></div></li>
</ul>
</li>

<!-- ===== 3. AMS/ATMS/WMS/IMS/PMS 等 ===== -->
<li class="node lv1"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">3. AMS / ATMS / WMS / IMS / PMS 等核心服务 <span class="tag tag-key">核心</span> <span class="tag tag-src">frameworks/base/services/core/java/com/android/server/{am,wm,input,pm}/</span></span><div class="desc">Framework 四大支柱服务，均运行在 system_server 进程，全部基于 Binder 对外暴露</div></div></div>
<ul>
  <!-- AMS -->
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">3.1 ActivityManagerService (AMS) <span class="tag tag-src">services/core/java/com/android/server/am/</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">职责</span><div class="desc">四大组件生命周期、进程调度、权限管理、内存回收 (LMK 联动)</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">进程优先级 (oom_adj)</span><div class="desc">前台/可见/服务/缓存进程，配合 Low Memory Killer 回收</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">Activity 启动流程 <span class="tag tag-flow">流程</span></span><div class="desc">startActivity → Instrumentation.execStartActivity → AMS.startActivity → ActivityStarter → ActivityStackSupervisor → Zygote fork → ActivityThread</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">关键类/方法</span><div class="desc">ActivityStackSupervisor · ActivityRecord · ProcessRecord · ActivityTaskManager (AOSP 10+ 拆分 ATM)</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">进程管理 <span class="tag tag-new">补全</span></span><div class="desc"><span class="code">ProcessRecord</span> 维护进程状态；<b>oom_adj</b> 随可见性/服务绑定动态调整，经 lmkd 消费阈值杀进程（见模块 9）；保活手段：前台服务/绑定组件/ContentProvider；<span class="code">am kill / am force-stop</span> 手动回收</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">生命周期状态机 <span class="tag tag-new">补全</span></span><div class="desc">onPause/onStop/onDestroy 由 AMS 经 <span class="code">H.PAUSE_ACTIVITY / STOP_ACTIVITY_SHOW</span> 驱动；「不可见即停止」策略；launchMode（standard/singleTop/singleTask/singleInstance）与 Intent flags 决定 Task 归置；旋转/配置变更经 ActivityClientRecord 保留 NonConfigurationInstances</div></div></div></li>
  </ul>
  </li>
  <!-- WMS -->
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">3.2 WindowManagerService (WMS) <span class="tag tag-src">services/core/java/com/android/server/wm/</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">职责</span><div class="desc">窗口管理、Z 轴层级、焦点管理、动画、Surface 分配</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">窗口核心方法</span><div class="desc"><span class="code">addWindow()</span> / <span class="code">relayoutWindow()</span> / <span class="code">removeWindow()</span> / <span class="code">performLayoutAndPlaceSurfacesLocked()</span></div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">窗口体系</span><div class="desc">WindowState → DisplayContent → <span class="code">Task.java</span> (<b>原 ActivityStack</b>，Android 11 重命名) → ActivityRecord → Token</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">ATMS↔WMS 协作 <span class="tag tag-new">补全</span></span><div class="desc">ATMS 管理 Activity/Task 栈，WMS 管理窗口；resume 时 ATMS 经 <span class="code">RootWindowContainer.resumeHomeActivity()</span> 协调，窗口 Surface 由 WMS 分配</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">转场/窗口动画</span><div class="desc">RemoteAnimationRunner / ShellTransition (AOSP 12+)，WMS 动画 + 合成</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">SurfaceControl</span><div class="desc"><span class="code">android/view/SurfaceControl.java</span> 为 native surface 句柄，WMS 经其向 SurfaceFlinger 申请 Layer</div></div></div></li>
  </ul>
  </li>
  <!-- IMS -->
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">3.3 InputManagerService (IMS) <span class="tag tag-src">services/core/java/com/android/server/input/</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">职责</span><div class="desc">输入设备监听、事件读取与分发、输入法窗口管理、按键策略</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">native 层 <span class="tag tag-src">frameworks/native/services/inputflinger/</span></span><div class="desc">InputManager → EventHub (设备枚举) → InputReader (读/映射) → InputDispatcher (派发)</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">事件分发流程 <span class="tag tag-flow">流程</span></span><div class="desc">驱动 /dev/input/eventX → EventHub → InputReader → InputDispatcher → 焦点 WindowState → View 树分发</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">按键拦截 <span class="tag tag-new">补全</span></span><div class="desc"><span class="code">PhoneWindowManager.interceptKeyBeforeQueueing()</span> (入队前) / <span class="code">interceptKeyBeforeDispatching()</span> (分发前)，多任务键改回桌面等</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">外设按键映射 <span class="tag tag-new">补全</span></span><div class="desc"><span class="code">frameworks/base/data/keyboards/*.kl</span> (scancode→keycode) / <span class="code">*.kcm</span> (key char map)；调试 <span class="code">getevent -l</span> / <span class="code">input keyevent</span></div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">车载相关</span><div class="desc">旋转屏幕、多屏输入、方向盘按键 (KEYCODE 映射)、触摸校准</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">ACTION_CANCEL 分发 <span class="tag tag-new">补全</span> <span class="tag tag-flow">踩坑</span></span><div class="desc">新窗口抢占焦点/手势被拦截时，InputDispatcher 向下发 <span class="code">ACTION_CANCEL</span>（如通知栏下拉、来电、车载多屏切换）；onTouchEvent 必须处理 CANCEL 恢复状态，否则按钮状态残留</div></div></div></li>
  </ul>
  </li>
  <!-- PMS -->
  <li class="node lv2"><div class="row"><span class="toggle" onclick="toggleNode(this)">▼</span><div class="label"><span class="title">3.4 PackageManagerService (PMS) <span class="tag tag-src">services/core/java/com/android/server/pm/</span></span></div></div>
  <ul>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">职责</span><div class="desc">APK 安装/卸载、包扫描、权限授予、组件解析</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">安装流程 <span class="tag tag-flow">流程</span></span><div class="desc">PackageInstaller → PMS.installPackage → PackageManagerServiceUtils → dex2oat → 写入 /data/app</div></div></div></li>
    <li class="node lv3"><div class="row"><span class="toggle leaf">·</span><div class="label"><span class="title">扫描</span><div class="desc">开机扫描 /system/app、/data/app、/vendor/app，构建 PackageInfo 缓存</div></div></div></li>
